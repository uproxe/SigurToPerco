# Проверки и сборка под Windows, Linux и macOS.
#
#  - каждый push в main и ручной запуск (Actions -> Build -> Run workflow):
#      тесты, проверка окна со скриншотами, сборки; готовые файлы - в «Artifacts»;
#  - выпуск релиза - любым из двух способов:
#      * Actions -> Build -> Run workflow -> отметить «Выпустить релиз»
#        (тег vX.Y.Z по версии из sigur_perco/__init__.py создаст сам GitHub);
#      * push тега vX.Y.Z (например v0.4.0);
#  - pull request: тесты и проверка окна.

name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз (тег vX.Y.Z по версии из sigur_perco/__init__.py)"
        type: boolean
        default: false

permissions:
  contents: read

# Python везде печатает и читает файлы в UTF-8 (на Windows по умолчанию cp1252)
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

# Новый push отменяет устаревшую сборку той же ветки, но релизные запуски не прерываются
concurrency:
  group: build-${{ github.ref }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}

jobs:
  # ------------------------------------------------------------------ тесты логики
  test:
    name: Тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Линтер
        run: python -m ruff check --output-format=github .
      - name: Тесты
        run: python -m pytest
      - name: Версия готова к выпуску
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python scripts/release_notes.py "${GITHUB_REF_NAME#v}" --check
          else
            v="$(python scripts/release_notes.py --print-version)"
            if [[ -n "$(git ls-remote --tags origin "refs/tags/v$v")" ]]; then
              echo "::error::Тег v$v уже есть. Поднимите __version__ в sigur_perco/__init__.py и опишите версию в CHANGELOG.md."
              exit 1
            fi
            python scripts/release_notes.py "$v" --check
          fi

  # ------------------------------------------------------------------ проверка окна
  # Запускает настоящее окно, прокликивает вкладки и сохраняет скриншоты
  # (артефакт ui-screenshots-*). Ошибка Tk в интерфейсе = красный тест.
  ui:
    name: Интерфейс (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            optional: false
          - name: windows
            os: windows-latest
            optional: true          # снимок экрана на сборочной машине Windows бывает чёрным
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Виртуальный экран (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb tk8.6 fonts-dejavu-core
      - run: python -m pip install -r requirements.txt pillow
      - name: Запуск окна и скриншоты (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x1000x24" python scripts/screenshots.py screenshots
      - name: Запуск окна и скриншоты (Windows)
        if: runner.os == 'Windows'
        run: python scripts/screenshots.py screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots-${{ matrix.name }}
          path: screenshots/
          if-no-files-found: warn

  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows${{ matrix.suffix && format(' ({0})', matrix.suffix) || '' }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    # сборка для Windows 7 - бонус: если она вдруг сломается, релиз всё равно выйдет
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            pyinstaller: "pyinstaller>=6.10"
            suffix: ""
            optional: false
          - python: "3.8"               # последний Python, который работает на Windows 7
            pyinstaller: "pyinstaller==5.13.2"
            suffix: "win7"
            optional: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "${{ matrix.pyinstaller }}"
      - name: Проверка tkinter
        run: python -c "import tkinter; print('Tcl/Tk', tkinter.Tcl().eval('info patchlevel'))"
      - name: Сборка
        shell: bash
        run: |
          ARGS=()
          [[ "$GITHUB_REF" == refs/tags/v* ]] && ARGS+=(--version "${GITHUB_REF_NAME#v}")
          [[ -n "${{ matrix.suffix }}" ]] && ARGS+=(--suffix "${{ matrix.suffix }}")
          python scripts/build.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: SigurPerco-windows${{ matrix.suffix && format('-{0}', matrix.suffix) || '' }}
          path: release/*
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux (.deb)
  # Собираем внутри Ubuntu 22.04: программа будет работать и на ней, и на всём,
  # что новее (Ubuntu 22.04+, Debian 12+, Mint 21+, Astra 1.8 и т.п.).
  linux:
    name: Linux (.deb)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      # python3-dev обязателен: PyInstaller нужна общая библиотека libpython,
      # а в Ubuntu она лежит в отдельном пакете
      - name: Системные пакеты
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip python3-dev python3-tk tk8.6 \
            binutils dpkg-dev git ca-certificates
      - uses: actions/checkout@v7
      - name: Зависимости
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install -r requirements.txt "pyinstaller>=6.10"
      - name: Проверка tkinter
        run: /opt/venv/bin/python -c "import tkinter; print('Tcl/Tk', tkinter.Tcl().eval('info patchlevel'))"
      - name: Сборка
        shell: bash
        run: |
          ARGS=()
          [[ "$GITHUB_REF" == refs/tags/v* ]] && ARGS+=(--version "${GITHUB_REF_NAME#v}")
          /opt/venv/bin/python scripts/build.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: SigurPerco-linux
          path: release/*
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS (.dmg)
  macos:
    name: macOS (${{ matrix.arch }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15            # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - os: macos-15-intel      # Intel
            arch: intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10"
      - name: Проверка tkinter
        run: python -c "import tkinter; print('Tcl/Tk', tkinter.Tcl().eval('info patchlevel'))"
      - name: Сборка
        run: |
          ARGS=()
          [[ "$GITHUB_REF" == refs/tags/v* ]] && ARGS+=(--version "${GITHUB_REF_NAME#v}")
          python scripts/build.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: SigurPerco-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  # ------------------------------------------------------------------ релиз
  release:
    name: GitHub Release
    needs: [ui, windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: SigurPerco-*
          merge-multiple: true
      - run: ls -la release
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Версия и описание релиза из CHANGELOG
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(python scripts/release_notes.py --print-version)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          python scripts/release_notes.py "$v" > release-body.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sigur → PERCo v${{ steps.ver.outputs.version }}
          body_path: release-body.md
          files: release/*
          fail_on_unmatched_files: true
